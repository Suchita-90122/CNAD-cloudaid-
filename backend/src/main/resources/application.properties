spring.datasource.url=jdbc:postgresql://localhost:5433/cloudaid?options=-c%20TimeZone%3DAsia%2FKolkata
spring.datasource.username=cloudaid
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'Asia/Kolkata'
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
